# Runs the checks that need no Claude Code: the real sandbox and the doc rules.
# `claude plugin test .` (the hooks) runs only on a contributor's machine.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Linux only: no sandbox-exec here, so the macOS network block is not tested.
    # 22.13 is the first Node with a stable --permission flag.
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13", "24"]
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: node tests/runner.integration.mjs
      - run: node tests/docs.check.mjs

  version:
    # A pull request that changes the plugin must raise its version.
    if: github.event_name == 'pull_request'
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: node tests/version.check.mjs "origin/${{ github.base_ref }}"
