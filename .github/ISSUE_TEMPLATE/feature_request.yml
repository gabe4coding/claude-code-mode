name: Feature request
description: A change you would like in code-mode
title: '[Feature]: '
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to exist? Keep it small if you can.
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: How to verify
      description: How would we know it works?
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and docs
          required: true
